[package]
name = "nucleus"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
fixture = { path = "fixture" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "macros", "matched-path", "query", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage"] }
config = { version = "0.15.25", default-features = false }
cookie = { version = "0.18.2", default-features = false }
domain = { path = "domain" }
governor = { version = "0.10.4", default-features = false, features = ["std"] }
http-body-util = { version = "0.1.5", default-features = false }
nonempty = { version = "0.12.0", default-features = false }
platform = { path = "platform" }
ipnet = { version = "2.12.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
serde_path_to_error = "0.1.20"
serde_with = { version = "3.24.0", default-features = false, features = ["macros", "json"] }
sd-notify = { version = "0.5.0", default-features = false }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.47.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6.11", default-features = false, features = ["request-id", "set-header", "trace"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "registry", "std"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "chrono", "uuid"] }
utoipa-axum = { version = "0.3.0", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
domain = { path = "domain", features = ["test-support"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tokio-postgres = { version = "0.7.18", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1.26.1", default-features = false, features = ["std", "v4"] }
fixture = { path = "fixture" }
deployment = { path = "deployment" }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.25.0"
tokio = { version = "1.47.1", default-features = false, features = ["rt-multi-thread", "time", "macros", "net", "io-util", "process"] }

[lints]
workspace = true

[profile.dev.package.postgres-protocol]
opt-level = 3

[workspace]
members = ["domain", "platform", "deployment", "fixture"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.0"

[workspace.lints.rust]
unsafe_code = "forbid"
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
