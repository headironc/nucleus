[package]
name = "deployment"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
domain = { path = "../domain" }
config = { version = "0.15.25", default-features = false }
platform = { path = "../platform" }
refinery = { version = "0.9.2", default-features = false, features = ["tokio-postgres"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.47.1", default-features = false, features = ["rt-multi-thread", "time"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }

[dev-dependencies]
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }
fixture = { path = "../fixture" }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.25.0"
tokio = { version = "1.47.1", default-features = false, features = ["macros", "sync"] }
uuid = { version = "1.26.1", default-features = false, features = ["std", "v4"] }

[lints]
workspace = true
