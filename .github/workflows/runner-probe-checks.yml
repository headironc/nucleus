name: Runner consumer checks

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, edited]
    paths:
      - .github/actionlint.yaml
      - .github/runner-probe/**
      - .github/workflows/runner-probe*.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: ./node_modules/.bin/tsc -p .github/runner-probe/tsconfig.json --noEmit
      - run: bun test ./.github/runner-probe/probe.test.ts
      - name: Check runner workflow syntax
        run: |
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 120 --output "$RUNNER_TEMP/actionlint.tar.gz" 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -shellcheck='' -pyflakes='' .github/workflows/runner-probe.yml .github/workflows/runner-probe-checks.yml
      - run: ./node_modules/.bin/prettier --check '.github/runner-probe/*' '.github/workflows/runner-probe*.yml'
