name: Review activity
run-name: activity:${{ github.event.pull_request.number }}

# Review and review-comment events use the PR context and may come from forks.
# Relay completion to the privileged default-branch gate without credentials.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - run: "true"
