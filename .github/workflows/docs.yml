name: Docs

on:
  pull_request:
  merge_group:
    types: [checks_requested]

# Keep unrelated PRs and queue refs in separate cancellation groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Test design preview
        run: bun test tools/preview-design.test.ts
      - run: bun run check:docs
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress --include-fragments=anchor-only README.md AGENTS.md halo/README.md 'docs/**/*.md' 'design/**/*.md' 'design/**/*.html'
