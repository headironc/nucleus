name: Review context
# GitHub fixes this name from the triggering event. The runs API's pull_requests
# field instead follows the live refs, so it cannot preserve a review baseline.
run-name: context:${{ github.event.pull_request.number }}:${{ github.event.pull_request.head.sha }}:${{ github.event.pull_request.base.sha }}:${{ github.event.pull_request.base.ref }}${{ github.event.pull_request.stack && format(':stack:{0}:{1}:{2}:{3}', github.event.pull_request.stack.number, github.event.pull_request.stack.position, github.event.pull_request.stack.size, github.event.pull_request.stack.base.ref) || '' }}${{ github.event.action != 'opened' && github.event.action != 'synchronize' && ':notice' || '' }}

on:
  pull_request_target:
    types: [opened, synchronize, edited, reopened, closed, converted_to_draft, ready_for_review]

permissions: {}

jobs:
  record:
    runs-on: ubuntu-26.04
    steps:
      - name: Keep the event context in the run record
        run: "true"
