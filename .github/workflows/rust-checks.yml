name: Rust checks

on:
  pull_request:
    branches: [dev, main, codex/rust-selection-acceptance-base]
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Nucleus Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Record candidate and Bun
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'repository=%s pr=%s run=%s attempt=%s candidate=%s\n' "$GITHUB_REPOSITORY" "$PR_NUMBER" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
          bun tools/check-bun.ts
          bun --version
      - name: Classify actual candidate
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: bun tools/check-inputs.ts --ci
      - name: Validate Rust selection
        env:
          TIER: ${{ steps.inputs.outputs.tier }}
        run: |
          case "$TIER" in
            skip|tools) printf 'Rust checks skipped: tier=%s has no Rust check inputs\n' "$TIER" ;;
            checks|full) printf 'Rust checks required: tier=%s\n' "$TIER" ;;
            *) printf 'Invalid Rust validation tier: %s\n' "$TIER" >&2; exit 1 ;;
          esac
      - name: Install native build dependencies
        if: ${{ success() && (steps.inputs.outputs.tier == 'checks' || steps.inputs.outputs.tier == 'full') }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config zlib1g-dev
      - name: Install Rust toolchain
        if: ${{ success() && (steps.inputs.outputs.tier == 'checks' || steps.inputs.outputs.tier == 'full') }}
        run: |
          bun -e '
          const { toolchain } = Bun.TOML.parse(await Bun.file("rust-toolchain.toml").text());
          const result = Bun.spawnSync([
            "rustup", "toolchain", "install", toolchain.channel,
            "--profile", toolchain.profile,
            ...toolchain.components.flatMap(component => ["--component", component]),
          ], { stdout: "inherit", stderr: "inherit" });
          process.exit(result.exitCode);
          '
          cargo clippy --version
      - name: Install nightly rustfmt
        if: ${{ success() && (steps.inputs.outputs.tier == 'checks' || steps.inputs.outputs.tier == 'full') }}
        run: rustup toolchain install nightly-2026-09-06 --profile minimal --component rustfmt
      - name: Record Rust tools
        if: ${{ success() && (steps.inputs.outputs.tier == 'checks' || steps.inputs.outputs.tier == 'full') }}
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          rustup run nightly-2026-09-06 rustfmt --version
          bun -e '
          const { toolchain } = Bun.TOML.parse(await Bun.file("rust-toolchain.toml").text());
          const result = Bun.spawnSync(["rustc", "--version"], { stdout: "pipe", stderr: "inherit" });
          if (result.exitCode !== 0 || !new TextDecoder().decode(result.stdout).startsWith("rustc " + toolchain.channel + " ")) process.exit(1);
          '
      - name: Check Rust formatting
        if: ${{ success() && (steps.inputs.outputs.tier == 'checks' || steps.inputs.outputs.tier == 'full') }}
        run: cargo +nightly-2026-09-06 fmt --all -- --check
      - name: Check workspace Clippy
        if: ${{ success() && (steps.inputs.outputs.tier == 'checks' || steps.inputs.outputs.tier == 'full') }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
