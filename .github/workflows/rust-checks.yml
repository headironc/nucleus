name: Rust checks

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Nucleus Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Check Bun pin
        run: bun tools/check-bun.ts
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config zlib1g-dev
      - name: Install Rust toolchain
        run: |
          bun -e '
          const { toolchain } = Bun.TOML.parse(await Bun.file("rust-toolchain.toml").text());
          const result = Bun.spawnSync([
            "rustup", "toolchain", "install", toolchain.channel,
            "--profile", toolchain.profile,
            ...toolchain.components.flatMap(component => ["--component", component]),
          ], { stdout: "inherit", stderr: "inherit" });
          process.exit(result.exitCode);
          '
          cargo clippy --version
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly-2026-09-06 --profile minimal --component rustfmt
      - name: Record candidate and tools
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf 'repository=%s pr=%s run=%s attempt=%s\n' "$GITHUB_REPOSITORY" "$PR_NUMBER" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bun --version
          rustc --version
          cargo --version
          cargo clippy --version
          rustup run nightly-2026-09-06 rustfmt --version
          bun -e '
          const { toolchain } = Bun.TOML.parse(await Bun.file("rust-toolchain.toml").text());
          const result = Bun.spawnSync(["rustc", "--version"], { stdout: "pipe", stderr: "inherit" });
          if (result.exitCode !== 0 || !new TextDecoder().decode(result.stdout).startsWith("rustc " + toolchain.channel + " ")) process.exit(1);
          '
      - name: Check Rust formatting
        run: cargo +nightly-2026-09-06 fmt --all -- --check
      - name: Check workspace Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
