name: Halo dependency image

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed full commit SHA containing the image inputs to publish.
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require an exact reviewed revision
        env:
          REVISION: ${{ inputs.revision }}
        run: '[[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .tool-versions
      - name: Build the dependency image
        run: bun tools/halo-ci-image.ts build halo-ci:build
      - name: Export the image without running it in the publisher
        run: docker save halo-ci:build --output "$RUNNER_TEMP/halo-ci.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halo-ci-image
          path: ${{ runner.temp }}/halo-ci.tar
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: halo-ci-image
          path: ${{ runner.temp }}
      - name: Publish the reviewed dependency image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ghcr.io/silence-force/nucleus-halo-ci:build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/halo-ci.tar"
          docker tag halo-ci:build "$IMAGE"
          source=$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')
          test "$source" = "https://github.com/silence-force/nucleus"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE"
          digest=$(docker manifest inspect --verbose "$IMAGE" |
            jq --exit-status --raw-output '.Descriptor.digest | select(test("^sha256:[0-9a-f]{64}$"))')
          printf '%s@%s\n' "${IMAGE%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify private package metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package=$(gh api --hostname github.com orgs/silence-force/packages/container/nucleus-halo-ci \
            --jq '{name,visibility,repository:.repository.full_name}')
          printf '%s\n' "$package"
          jq --exit-status '.visibility == "private" and (.repository == null or .repository == "silence-force/nucleus")' <<< "$package"
      - name: Remove publisher credentials
        if: ${{ always() }}
        run: docker logout ghcr.io
