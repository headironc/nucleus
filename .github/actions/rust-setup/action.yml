name: Rust build environment
description: Prepare the pinned tools and environment-bound dependency cache for Rust checks.
inputs:
  cache-key:
    description: Separate cache owner for checks or one package.
    required: true
  cache-lookup-only:
    description: For prewarming, skip restoring an exact cache hit; otherwise restore normally.
    default: "false"
outputs:
  cache-hit:
    description: Whether an exact Rust dependency cache was found or restored.
    value: ${{ steps.cache-lookup.outputs.cache-hit == 'true' || steps.cache.outputs.cache-hit == 'true' }}
  environment:
    description: Runner image and installed system package fingerprint.
    value: ${{ steps.environment.outputs.key }}
runs:
  using: composite
  steps:
    - name: Check workspace inputs
      shell: bash
      run: |
        set -euo pipefail
        test -f Cargo.toml
        test -f Cargo.lock
        test -f rust-toolchain.toml
        rustup show active-toolchain
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .tool-versions
    - name: Install PostgreSQL build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends build-essential bison flex curl pkg-config libssl-dev libicu-dev libreadline-dev zlib1g-dev libxml2-dev
    - name: Identify build environment
      id: environment
      shell: bash
      run: |
        set -euo pipefail
        packages=$(dpkg-query --show --showformat='${binary:Package}=${Version}\n' |
          LC_ALL=C sort | sha256sum | cut -d ' ' -f 1)
        printf 'key=%s-%s-%s\n' "$ImageOS" "$ImageVersion" "$packages" >> "$GITHUB_OUTPUT"
    - name: Look up Rust dependencies for prewarming
      id: cache-lookup
      if: ${{ inputs.cache-lookup-only == 'true' }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ steps.environment.outputs.key }}-${{ inputs.cache-key }}
        workspaces: ". -> target/cargo"
        cache-bin: false
        lookup-only: true
        save-if: false
    - name: Cache Rust dependencies
      id: cache
      if: ${{ steps.cache-lookup.outputs.cache-hit != 'true' }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ steps.environment.outputs.key }}-${{ inputs.cache-key }}
        workspaces: ". -> target/cargo"
        cache-bin: false
