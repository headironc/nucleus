# Include inside the site's existing HTTPS server. Match Nucleus's exact HTTPS origin.
# Generate nginx-assets.conf for the immutable release directory before switching current.
access_log off;
error_log /dev/null emerg;
autoindex off;
add_header Cache-Control no-store always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;

include /srv/halo/current/build/nginx-assets.conf;

location /api/ {
    # Keep the website's no-store default out of upstream API cache policies.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_intercept_errors off;
    proxy_read_timeout 40s;
    client_max_body_size 8k;

    location = /api/v1/accounts/current/avatar {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8080;
    }
}

location / {
    proxy_pass http://127.0.0.1:3080;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_intercept_errors off;
    proxy_read_timeout 15s;
}
