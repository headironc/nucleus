name: Dev admission

on:
  pull_request_target:
    branches: [dev]
    types:
      [
        opened,
        edited,
        synchronize,
        reopened,
        closed,
        converted_to_draft,
        ready_for_review,
      ]
  push:
    branches: [dev]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Rust, Docs, Halo, Review context, Review activity]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [evaluate, merge, recover]
        required: true
        default: evaluate
        description: Evaluate PRs, authorize one exact squash, or recover the original merge
      pr:
        type: string
        description: Exact independent dev PR number (merge only)
      head:
        type: string
        description: Exact authorized candidate (full SHA, merge only)

permissions: {}

jobs:
  admit:
    if: >-
      github.repository == 'headironc/nucleus' && github.ref == 'refs/heads/dev' &&
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'))
    runs-on: ubuntu-26.04
    environment: dev-admission
    permissions:
      contents: read
      actions: read
    concurrency:
      group: review-gate
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .tool-versions
      - run: bun tools/check-bun.ts
      - name: Verify trusted invocation
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: bun tools/dev-admission.ts --preflight
      - name: Evaluate, merge or recover
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
          NUCLEUS_DEV_PRIVATE_KEY: ${{ secrets.NUCLEUS_DEV_PRIVATE_KEY }}
        run: bun tools/dev-admission.ts
