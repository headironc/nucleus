name: Rust dependency cache

on:
  push:
    branches: [dev]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - rust-toolchain.toml
      - .cargo/**
      - .github/actions/rust-setup/**
      - .github/actions/package-setup/**
      - .github/actions/halo-setup/**
      - .github/halo-ci/**
      - .github/workflows/cache.yml
      - .github/workflows/rust.yml
      - .github/workflows/halo.yml
      - .tool-versions
      - halo/package.json
      - halo/bun.lock
      - tools/check-packages.ts
      - tools/halo-ci-image.ts
      - fixture/postgresql.version
      - fixture/postgresql.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/cargo
    outputs:
      packages: ${{ steps.packages.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        id: setup
        timeout-minutes: 10
        with:
          cache-key: checks
          cache-lookup-only: true
      - name: Prepare Clippy dependencies
        id: compile
        if: ${{ steps.setup.outputs.cache-hit != 'true' }}
        run: cargo check --workspace --all-targets --locked
      - name: Discover workspace packages
        id: packages
        shell: bash
        run: |
          set -euo pipefail
          names=$(bun tools/check-packages.ts --list)
          printf 'names=%s\n' "$names" >> "$GITHUB_OUTPUT"

  packages:
    name: cache (${{ matrix.package }})
    needs: checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    container:
      image: ghcr.io/silence-force/nucleus-ci@sha256:bd2c19ea184e0fdae98cedc7741b19948165499401820e0481735b4be9d75e3b
      options: --user 1001:1001 --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package: ${{ fromJSON(needs.checks.outputs.packages) }}
    env:
      CARGO_TARGET_DIR: target/cargo
      HALO_CI_IMAGE: ghcr.io/silence-force/nucleus-ci@sha256:bd2c19ea184e0fdae98cedc7741b19948165499401820e0481735b4be9d75e3b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-setup
        id: setup
        timeout-minutes: 10
        with:
          cache-key: package-${{ matrix.package }}
          cache-lookup-only: true
      - name: Prepare package dependencies
        id: compile
        if: ${{ steps.setup.outputs.cache-hit != 'true' }}
        env:
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --package "$PACKAGE" --locked
          cargo test --package "$PACKAGE" --locked --no-run

  halo:
    name: cache (Halo HTTP)
    if: ${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    container:
      image: ghcr.io/silence-force/nucleus-ci@sha256:bd2c19ea184e0fdae98cedc7741b19948165499401820e0481735b4be9d75e3b
      options: --user 1001:1001 --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/cargo
      HALO_CI_IMAGE: ghcr.io/silence-force/nucleus-ci@sha256:bd2c19ea184e0fdae98cedc7741b19948165499401820e0481735b4be9d75e3b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/halo-setup
        id: setup
        with:
          cache-lookup-only: true
      - name: Prepare HTTP test dependencies
        id: compile
        if: ${{ steps.setup.outputs.cache-hit != 'true' }}
        run: cargo test -p nucleus --locked --test http --no-run
